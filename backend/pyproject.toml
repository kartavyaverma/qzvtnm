[project]
name = "windcast-api"
version = "1.0.0"
description = "Decision-time wind forecast and accuracy API for GB day-ahead power purchasing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
fetch = ["httpx>=0.27,<1"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
